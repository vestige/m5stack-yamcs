# 冗長化の実験: Standby 系 (Active 系が止まったときに代わる系)
# サーバの名前。2つの系を同じ Mac で動かすので、それぞれに付ける。付けないとどちらもホスト名になり、
# レプリケーションで Standby 系が「自分が出したデータ」と見なして、受け取った TM をすべて捨ててしまう
serverId: m5sat-standby
services:
  - class: org.yamcs.http.HttpServer
    args:
      port: 8191
      address: "0.0.0.0"

dataDir: yamcs-data
instances:
  - m5sat
secretKey: changeme-standby
