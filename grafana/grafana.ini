; M5Sat の Grafana の設定 (#21)。scripts/start.sh が読み込む。
; データ・プラグイン・ログの置き場所と provisioning の場所は、start.sh が環境変数 (GF_PATHS_*) で渡す

[server]
http_addr = 127.0.0.1
http_port = 3000

; ローカルでの学習用。ダッシュボードを見るだけならログインは要らない (閲覧者として入れる)。
; 編集するときは右上の Sign in から admin で入る。最初のパスワードは admin で、最初のログインで変えるように言われる
; (変えたパスワードは grafana/data/grafana.db に残る。ここを書き換えても変わらない)
[security]
admin_user = admin
admin_password = admin

[auth.anonymous]
enabled = true
org_role = Viewer

; YAMCS の開発元が出しているデータソース。Grafana の公式のプラグイン一覧に無いので、署名なしを許可する
[plugins]
allow_loading_unsigned_plugins = yamcs-yamcs-datasource

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[news]
news_feed_enabled = false
