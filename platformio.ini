; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = m5stack-core-esp32

[env:m5stack-core-esp32]
platform = espressif32
board = m5stack-core-esp32
framework = arduino
lib_deps =
  m5stack/M5Unified@^0.2.2
; src/ground/ は地上局の無線機用なので、衛星のビルドには入れない
build_src_filter = +<*> -<ground/>

upload_port = /dev/cu.usbserial-0106F6FC
monitor_port = /dev/cu.usbserial-0106F6FC
monitor_speed = 115200

; 地上局の無線機 (M5StickC): pio run -e ground-station -t upload
[env:ground-station]
platform = espressif32
board = m5stick-c
framework = arduino
lib_deps =
  m5stack/M5Unified@^0.2.2
build_src_filter = +<ground/>
upload_port = /dev/cu.usbserial-AD56983592
monitor_port = /dev/cu.usbserial-AD56983592
monitor_speed = 115200

; Mac上でNMEAパーサのユニットテストを実行する: pio test -e native
[env:native]
platform = native
test_build_src = no

; Unityで緯度経度(double)を検証するため
build_flags = -DUNITY_INCLUDE_DOUBLE
