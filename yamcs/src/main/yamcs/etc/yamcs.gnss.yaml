services:
  - class: org.yamcs.archive.XtceTmRecorder
  - class: org.yamcs.archive.ParameterRecorder
  - class: org.yamcs.archive.AlarmRecorder
  - class: org.yamcs.archive.EventRecorder
  - class: org.yamcs.archive.ReplayServer
  - class: org.yamcs.parameter.SystemParametersService
    args:
      producers:
        - fs
        - jvm
  - class: org.yamcs.ProcessorCreatorService
    args:
      name: realtime
      type: realtime
  # ダンプ (#56) で届いたパケットを処理するプロセッサ。イベントの文章を作るアルゴリズムを動かすためだけに使う
  # (運用画面の値やアラームはリアルタイムのプロセッサのまま。processor.yaml の dump)
  - class: org.yamcs.ProcessorCreatorService
    args:
      name: dump
      type: dump
  - class: org.yamcs.archive.CommandHistoryRecorder
  - class: org.yamcs.parameterarchive.ParameterArchive
    args:
      # パラメータの履歴 (Grafana が読むもの) は、パケットのアーカイブから作る (#56)。
      # リアルタイムの書き手 (realtimeFiller) を使うと、テレメトリが届いている間ずっと「今」の区切り (約2.3時間) を
      # 押さえてしまい、ダンプで届いた同じ区切りのパラメータを書き込めない (パスの外の空白が埋まらない)。
      # そこで、リアルタイムとダンプのどちらで届いても、パケットのアーカイブ (重なりは1つになっている) から作り直す
      realtimeFiller:
        enabled: false
      backFiller:
        enabled: true
        monitorStreams: ["tm_realtime", "tm_dump"]
        # パケットが届き続けている間は15秒ごとに、届かなくなったら (ダンプを降ろし終えた、LOS) 5秒後に作り直す。
        # なので、Grafana のグラフに出るのは、届いてから15秒ほど後になる
        streamUpdateFillPolicy:
          - dataAge: 0
            fillFrequency: 15
            quietThreshold: 5
  - class: org.yamcs.plists.ParameterListService
  # Timeline (5-9)。パスや観測の予定を時間軸に並べ、予定の時刻にアクティビティ (スクリプトやスタック) を自動で始める
  - class: org.yamcs.timeline.TimelineService

# アクティビティ (Timeline や Procedures から実行するもの) の設定
activities:
  # スクリプトは etc/scripts/ から探す。.py は python3 で動かす
  # (YAMCS_URL, YAMCS_INSTANCE などの環境変数が渡される)
  scriptExecution:
    fileAssociations:
      py: python3 -u

dataLinks:
  # M5Stackから届くGNSSテレメトリ (CCSDS Space Packet, lib/TelemetryPacket)
  # M5Stackは10015へ送り、tools/udp_receiver.py がログを取りつつ10016へ中継する
  - name: m5stack-gnss
    class: org.yamcs.tctm.UdpTmDataLink
    stream: tm_realtime
    port: 10016
    packetPreprocessorClassName: org.yamcs.tctm.GenericPacketPreprocessor
    packetPreprocessorArgs:
      # 時刻は、パケットの副ヘッダの機上時刻 (Unix 時刻のミリ秒、#54) を使う。ダンプ (#56) と同じ時刻になるので、
      # 同じパケットがリアルタイムとダンプの両方で届いても、アーカイブには1つだけ残る (時刻 + シーケンス番号で1つに決まる)。
      # 機上時刻がまだわからない (0) パケットには、tools/udp_receiver.py が受け取った時刻を入れる
      timestampOffset: 6
      timeEncoding:
        type: FIXED
        size: 8
        epoch: UNIX
      # 先頭4バイト (APID + Sequence count) をシーケンス番号として使う
      seqCountOffset: 0

  # ダンプ (#56): データレコーダから降ろしたパケット。tools/udp_receiver.py が中のパケットを取り出して10017へ送る。
  # リアルタイムとは別の流れ (tm_dump) に入れるので、運用画面の今の値は上書きしない。
  # 時刻は、パケットの副ヘッダの機上時刻 (Unix 時刻のミリ秒) を使う。アーカイブには衛星で作った時刻で残る
  - name: m5stack-dump
    class: org.yamcs.tctm.UdpTmDataLink
    stream: tm_dump
    port: 10017
    packetPreprocessorClassName: org.yamcs.tctm.GenericPacketPreprocessor
    packetPreprocessorArgs:
      timestampOffset: 6
      # 8バイトの整数。YAMCS はこれをミリ秒として読む (秒に直す multiplier は付けない)
      timeEncoding:
        type: FIXED
        size: 8
        epoch: UNIX
      seqCountOffset: 0

  # 衛星へのTC。tools/udp_receiver.py (地上局) が受け取り、衛星へ中継する
  - name: m5stack-tc
    class: org.yamcs.tctm.UdpTcDataLink
    stream: tc_realtime
    host: 127.0.0.1
    port: 10025
    # TCパケットの長さフィールドとシーケンス番号を埋める。
    # 埋めたシーケンス番号はコマンド履歴の ccsds-seqcount に残り、Verifierで衛星のACKと照らし合わせる
    commandPostprocessorClassName: org.yamcs.tctm.IssCommandPostprocessor

mdb:
  - type: xtce
    args:
      file: mdb/m5sat.xml

streamConfig:
  tm:
    - name: "tm_realtime"
      processor: "realtime"
    - name: "tm_dump"
      processor: "dump"
  cmdHist: ["cmdhist_realtime", "cmdhist_dump"]
  event: ["events_realtime", "events_dump"]
  param: ["pp_realtime", "pp_dump", "sys_param", "proc_param"]
  parameterAlarm: ["alarms_realtime"]
  tc:
    - name: "tc_realtime"
      processor: "realtime"
