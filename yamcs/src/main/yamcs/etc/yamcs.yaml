services:
  - class: org.yamcs.http.HttpServer
    args:
      port: 8090
      address: "0.0.0.0"

# データの保存先。yamcs:run の実行場所 (target/yamcs) からの相対パス。
# `mvn clean` すると保存したテレメトリも消える。
dataDir: yamcs-data

instances:
  - gnss

# コマンドスタック (Procedures → Stacks) の置き場所。
# リポジトリの yamcs/src/main/yamcs/stacks/ をそのまま使うので、gitで管理でき、
# Web UIで編集した内容もこのフォルダのファイルに残る (パスは yamcs:run の作業フォルダ target/yamcs から見たもの)
buckets:
  - name: stacks
    path: ../../src/main/yamcs/stacks

# 署名などに使う、このYAMCSサーバ固有の秘密鍵 (ローカルでの学習用)
secretKey: changeme
